name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      - uses: actions/cache@v4
        with:
          path: |
            .build
            build/mediaremote
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'scripts/build-mediaremote.sh') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Никаких ключей в репозитории
        run: |
          if git grep -nIE "BEGIN [A-Z ]*PRIVATE KEY|sk-ant-[A-Za-z0-9]{8}|ghp_[A-Za-z0-9]{20}"; then
            echo "::error::В репозитории похоже на ключ или токен"; exit 1
          fi

      - name: Тесты
        run: swift test

      - name: Сборка Mely.app
        run: scripts/build-app.sh --ad-hoc
